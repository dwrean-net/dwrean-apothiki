name: Build Windows Portable

on:
  push:
    branches: [ main ]
    paths:
      - 'app.py'
      - 'app_v111.py'
      - 'requirements.txt'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read application version
        shell: pwsh
        run: |
          $content = Get-Content "app_v111.py" -Raw
          $match = [regex]::Match($content, 'core\.APP_VERSION\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw "Could not read APP_VERSION from app_v111.py" }
          $version = $match.Groups[1].Value
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building dwrean Apothiki v$version"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build portable EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "dwrean Apothiki" app_v111.py
          New-Item -ItemType Directory -Force -Path "portable\data\images" | Out-Null
          Copy-Item "dist\dwrean Apothiki.exe" "portable\dwrean Apothiki.exe" -Force

      - name: Create release ZIP
        shell: pwsh
        run: |
          $zip = "dwrean-Apothiki-Windows-v$env:APP_VERSION.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "portable\*" -DestinationPath $zip -CompressionLevel Optimal

      - name: Upload portable application artifact
        uses: actions/upload-artifact@v4
        with:
          name: dwrean-Apothiki-Windows-v${{ env.APP_VERSION }}
          path: portable/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:APP_VERSION
          $tag = "v$version"
          $zip = "dwrean-Apothiki-Windows-v$version.zip"
          $notes = @"
          ## dwrean Αποθήκη $version

          Portable εφαρμογή διαχείρισης αποθήκης για Windows.

          ### Τελευταίες βελτιώσεις
          - Ανανεωμένη ταυτότητα του dwrean Αποθήκη μέσα στην εφαρμογή
          - Διατηρούνται οι συντομεύσεις Ctrl+C, Ctrl+V, Ctrl+X και Ctrl+A
          - Διατηρούνται φωτογραφίες υλικών, φίλτρα, εκτυπώσεις, CSV και Backup/Επαναφορά
          - Portable λειτουργία χωρίς εγκατάσταση

          Αποσυμπίεσε το ZIP και εκτέλεσε το `dwrean Apothiki.exe`.
          "@

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $zip --title "dwrean Αποθήκη $version" --notes $notes --target main --repo $env:GITHUB_REPOSITORY
          }
