name: Build Windows Portable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build portable EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "dwrean Apothiki" app_v111.py
          New-Item -ItemType Directory -Force -Path "portable\data\images" | Out-Null
          Copy-Item "dist\dwrean Apothiki.exe" "portable\dwrean Apothiki.exe" -Force

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: dwrean-Apothiki-Windows-v1.1.1
          path: portable/
          if-no-files-found: error
          retention-days: 30
