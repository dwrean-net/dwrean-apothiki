name: Build Windows Portable

on:
  push:
    branches: [ main ]
    paths:
      - 'app.py'
      - 'app_v111.py'
      - 'requirements.txt'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build portable EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "dwrean Apothiki" app_v111.py
          New-Item -ItemType Directory -Force -Path "portable\data\images" | Out-Null
          Copy-Item "dist\dwrean Apothiki.exe" "portable\dwrean Apothiki.exe" -Force

      - name: Create release ZIP
        shell: pwsh
        run: |
          if (Test-Path "dwrean-Apothiki-Windows-v1.1.3.zip") { Remove-Item "dwrean-Apothiki-Windows-v1.1.3.zip" -Force }
          Compress-Archive -Path "portable\*" -DestinationPath "dwrean-Apothiki-Windows-v1.1.3.zip" -CompressionLevel Optimal

      - name: Upload portable application artifact
        uses: actions/upload-artifact@v4
        with:
          name: dwrean-Apothiki-Windows-v1.1.3
          path: portable/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release v1.1.3
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          ## dwrean Αποθήκη 1.1.3

          Portable εφαρμογή διαχείρισης αποθήκης για Windows.

          ### Τι νέο υπάρχει
          - Διορθώθηκε το κουμπί «Αφαίρεση φωτογραφίας», ώστε το κείμενό του να εμφανίζεται πάντα κανονικά
          - Προστέθηκαν Ctrl+C, Ctrl+V, Ctrl+X και Ctrl+A στα πεδία κειμένου
          - Οι συντομεύσεις λειτουργούν και με ενεργό ελληνικό πληκτρολόγιο στα Windows
          - Παραμένει η προσαρμοζόμενη διάταξη με το κάτω toolbar πάντα ορατό

          Δεν απαιτείται εγκατάσταση. Αποσυμπίεσε το ZIP και εκτέλεσε το `dwrean Apothiki.exe`.
          "@

          gh release view v1.1.3 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.1.3 "dwrean-Apothiki-Windows-v1.1.3.zip" --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create v1.1.3 "dwrean-Apothiki-Windows-v1.1.3.zip" --title "dwrean Αποθήκη 1.1.3" --notes $notes --target main --repo $env:GITHUB_REPOSITORY
          }
